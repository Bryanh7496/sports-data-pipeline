# dbt looks for profiles.yml in the current directory first, so run dbt
# from this folder (sports-data-pipeline/dbt). There are no secrets in
# this file: every credential comes from environment variables (see
# .env.example), so it is safe to commit.

sports_pipeline:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'SPORTS_DB') }}"
      schema: analytics   # default schema; models override via +schema
      threads: 2
